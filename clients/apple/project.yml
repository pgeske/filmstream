name: FilmstreamApple
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  FilmstreamCore:
    path: Packages/FilmstreamCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  FilmstreamTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: FilmstreamTV
        excludes:
          - Info.plist
    dependencies:
      - package: FilmstreamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alyoshukai.filmstream.tv
        PRODUCT_NAME: TeaStream
        INFOPLIST_FILE: FilmstreamTV/Info.plist
        TARGETED_DEVICE_FAMILY: 3
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
  FilmstreamIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FilmstreamIOS
        excludes:
          - Info.plist
    dependencies:
      - package: FilmstreamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alyoshukai.filmstream.ios
        PRODUCT_NAME: TeaStream
        INFOPLIST_FILE: FilmstreamIOS/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FilmstreamMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: FilmstreamMac
        excludes:
          - Info.plist
          - FilmstreamMac.entitlements
    dependencies:
      - package: FilmstreamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alyoshukai.filmstream.mac
        PRODUCT_NAME: TeaStream
        INFOPLIST_FILE: FilmstreamMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: FilmstreamMac/FilmstreamMac.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  FilmstreamTV:
    build:
      targets:
        FilmstreamTV: all
    run:
      config: Debug
    archive:
      config: Release
  FilmstreamIOS:
    build:
      targets:
        FilmstreamIOS: all
    run:
      config: Debug
    archive:
      config: Release
  FilmstreamMac:
    build:
      targets:
        FilmstreamMac: all
    run:
      config: Debug
    archive:
      config: Release
